[project]
name = "edc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "accelerate>=1.9.0",
    "beautifulsoup4>=4.13.4",
    "datasets>=4.0.0",
    "lxml>=6.0.0",
    "nervaluate==0.1.7",
    "nltk>=3.9.1",
    "openai>=1.97.0",
    "peft>=0.16.0",
    "scikit-learn>=1.6.1",
    "sentence-transformers>=5.0.0",
    "transformers>=4.52.0",
    "torch>=2.8.0",
    "unidecode>=1.4.0",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.8.0",
]
rocm64 = [
  "torch>=2.8.0",
  "pytorch-triton-rocm>=3.1.0", 
]

[dependency-groups]
dev = [
    "hypothesis>=6.79.4",
    "pytest>=7.4.4",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "rocm64" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-rocm64", extra = "rocm64" },
]
pytorch-triton-rocm = [
  { index = "pytorch-rocm64", extra = "rocm64" }
]

[[tool.uv.index]]
name = "pytorch-rocm64"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
